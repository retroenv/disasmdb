[comments_before]
$8000 = Initialize the NES and choose a cold or warm boot.
$8057 = Main thread waits here; NMI drives the game.
$805A = Low bytes of video-buffer pointers.
$806D = High bytes of video-buffer pointers.
$8080 = Offsets selecting the video buffer to clear.
$8082 = Update the display and run the next game frame.
$8182 = Update pause state from controller input.
